<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>УЗИ-МУЗИ — Выпуск 2</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Контейнер-лента */
        .swiper-container {
            display: flex;
            width: 300%; 
            height: 100%;
            transition: transform 0.3s ease-out;
        }

        /* Страницы игры */
        .page {
            width: 33.3333%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            position: relative;
        }

        /* Удерживаем формат 9:16 на любых экранах */
        .page img, .page video {
            height: 100%;
            aspect-ratio: 9/16;
            object-fit: cover;
            display: block;
        }

        /* МИГАЮЩАЯ ПЛАШКА "ЛИСТАЙ ВЛЕВО" */
        .hint-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            pointer-events: none;
            z-index: 5;
            animation: pulseBlink 2s infinite ease-in-out;
        }

        @keyframes pulseBlink {
            0% { opacity: 0.3; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(0.95); }
        }

        /* СТАТИЧНАЯ КНОПКА НА ВИДЕО */
        .play-pause-badge {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: rgba(255, 215, 0, 0.9);
            color: #000000;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="swiper-container" id="swiper">
        <!-- Экран 1: Продающая обложка -->
        <div class="page" id="page1">
            <div class="hint-badge">Листай влево ➔</div>
            <img src="https://files.catbox.moe/tjqtyt.jpg" alt="Обложка УЗИ-МУЗИ">
        </div>

        <!-- Экран 2: Правила игры -->
        <div class="page" id="page2">
            <div class="hint-badge">Листай влево ➔</div>
            <img src="https://files.catbox.moe/jz3zjh.png" alt="Правила игры">
        </div>

        <!-- Экран 3: Видео-игра (Выпуск 2) -->
        <div class="page" id="page3">
            <div class="play-pause-badge">🔘 Старт / Стоп</div>
            <video id="gameVideo" loop playsinline preload="auto">
                <source src="https://files.catbox.moe/1fu55t.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        const video = document.getElementById('gameVideo');
        const swiper = document.getElementById('swiper');
        let currentPage = 0;

        /* ОСНОВНАЯ ЛОГИКА ИГРЫ (ЛИСТАНИЕ) */
        function changePage(pageIndex) {
            currentPage = pageIndex;
            swiper.style.transform = `translateX(-${currentPage * 33.3333}%)`;
            
            if (currentPage === 2) {
                video.play().catch(() => {});
            } else {
                video.pause();
            }
        }

        document.getElementById('page1').addEventListener('click', () => changePage(1));
        document.getElementById('page2').addEventListener('click', () => changePage(2));

        let startX = 0;
        document.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });

        document.addEventListener('touchend', (e) => {
            let diffX = startX - e.changedTouches[0].clientX;
            if (diffX > 60 && currentPage < 2) changePage(currentPage + 1);
            if (diffX < -60 && currentPage > 0) changePage(currentPage - 1);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                if (currentPage < 2) changePage(currentPage + 1);
            }
            if (e.key === 'ArrowLeft') {
                if (currentPage > 0) changePage(currentPage - 1);
            }
        });

        video.addEventListener('click', (e) => {
            e.stopPropagation();
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });
    </script>

</body>
</html>
